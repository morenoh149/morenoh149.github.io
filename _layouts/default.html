<html>
  <head>
    <title>Harry Moreno | Blog</title>
    {% include meta-tags.html %}
    <meta name="Description"
          content="Harry Moreno's personal blog. Come read about what he's
          programming, what he thinks is cool and other neat things.">

  </head>
  <body>
    <div class="container-fluid">

      {% include header.html %}

      <div class="row">
        <div class="col-sm-8 col-sm-offset-2
                    col-md-7 col-md-offset-2">
          <dl>
            {% for post in site.posts %}
              <dt>
                <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
                {{ post.date | date: "%d %B %Y" }}
                {% if site.github %}
                <!-- &nbsp; | <a href="http://harrymoreno.com{{ post.url }}#disqus_thread"></a> -->
                {% endif %}

              </dt>
              <dd>
                {{ post.excerpt }}
              </dd>
            {% endfor %}
          </dl>
        </div>

        <div class="sidebar
                    col-sm-8 col-sm-offset-2
                    col-md-2 col-md-offset-0">
          {% include sidebar.html %}
        </div>

      </div>

      <!-- {% include footer.html %} -->

    </div><!-- container -->

    {% include navbar.html %}

    <!-- disqus comment count code -->
    <script type="text/javascript">
      /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */
      var disqus_shortname = 'harrymorenosblog'; // required: replace example with your forum shortname

      /* * * DON'T EDIT BELOW THIS LINE * * */
      (function () {
          var s = document.createElement('script'); s.async = true;
          s.type = 'text/javascript';
          s.src = '//' + disqus_shortname + '.disqus.com/count.js';
          (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s);
      }());
    </script>
  </body>
</html>
