<html>
  <head>
    <title>Harry Moreno | Blog</title>
    {% include meta-tags.html %}
    <meta name="Description" content="Harry Moreno's personal blog. Come read about what he's programming, what he thinks is cool and other neat things.">

  </head>
  <body>
    <div class="container">

      {% include header.html %}

      <div class="row">
        <div class="col-sm-10 col-sm-offset-1
                    col-md-10 col-md-offset-0
                    col-lg-8  col-lg-offset-0">
          <dl>
            {% for post in site.posts %}
              <dt>
              <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
                {{ post.date | date: "%d %B %Y" }} |
                {% if site.github %}
                <a href="http://harrymoreno.com{{ post.url }}#disqus_thread"></a>
                {% endif %}

              </dt>
              <dd>
                {{ post.content }}
              </dd>
            {% endfor %}
          </dl>
        </div>

        <div class="sidebar
                    col-sm-12 col-sm-offset-0
                    col-md-2 col-md-offset-0
                    col-lg-3 col-lg-offset-1">
          {% include sidebar.html %}
        </div>

      </div>

      {% include footer.html %}

    </div><!-- container -->

    {% include navbar.html %}

    <!-- disqus comment count code -->
    <script type="text/javascript">
      /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */
      var disqus_shortname = 'harrymorenosblog'; // required: replace example with your forum shortname

      /* * * DON'T EDIT BELOW THIS LINE * * */
      (function () {
          var s = document.createElement('script'); s.async = true;
          s.type = 'text/javascript';
          s.src = '//' + disqus_shortname + '.disqus.com/count.js';
          (document.getElementsByTagName('HEAD')[0] || document.getElementsByTagName('BODY')[0]).appendChild(s);
      }());
    </script>
  </body>
</html>
