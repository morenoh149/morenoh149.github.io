<html>
  <head>
    <title>Harry Moreno | {{ page.title}}</title>
    {% include meta-tags.html %}

  </head>
  <body>
    <div class="container">

      {% include header.html %}

      <div class="row">
        <div class="col-sm-10 col-sm-offset-1
                    col-md-10 col-md-offset-0
                    col-lg-8  col-lg-offset-0">

          <h3><a href="{{ page.url }}">{{ page.title }}</a></h3>
          <strong>{{ page.date | date: "%d %B %Y" }}</strong>

          <p>{{ content }}</p>
          {% include tweet_this.html %}

          {% if site.github %}
            <div id="disqus_thread"></div>
            <script type="text/javascript">
                /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */
                var disqus_shortname = 'harrymorenosblog'; // required: replace example with your forum shortname

                /* * * DON'T EDIT BELOW THIS LINE * * */
                (function() {
                    var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
                    dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
                    (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
            <a href="http://disqus.com" class="dsq-brlink">comments powered by <span class="logo-disqus">Disqus</span></a>
          {% endif %}
        </div>

        <div class="sidebar
                    col-sm-12 col-sm-offset-0
                    col-md-2 col-md-offset-0
                    col-lg-3 col-lg-offset-1">
          {% include sidebar.html %}
        </div>

      </div>

      {% include footer.html %}

    </div><!-- container -->

    {% include navbar.html %}

  </body>
</html>
