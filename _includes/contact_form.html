<h2>Contact Me</h2>
<form
  action="https://formspree.io/morenoh149@gmail.com"
  method="POST"
  id="contact-form"
>
  <label for="form-name">Name:</label>
  <input id="form-name" type="text" name="name">
  <br/>
  <label for="form-email">Email</label>
  <input id="form-email" type="email" name="_replyto">
  <br/>
  <label for="form-company-name">Company Name</label>
  <input id="form-company-name" type="text" name="company">
  <br/>
  <label for="form-message">Message</label>
  <textarea id="form-message" name="contact-form" rows="10"></textarea>
  <br/>
  <button type="submit">Send</button>
</form>
