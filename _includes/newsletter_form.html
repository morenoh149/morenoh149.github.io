<form
  action="https://tinyletter.com/morenoh149"
  method="post"
  target="popupwindow"
  class="newsletter"
  onsubmit="
    window.open('https://tinyletter.com/morenoh149',
               'popupwindow',
               'scrollbars=yes,width=800,height=600');
    return true;
  "
>
 <input type="hidden" value="1" name="embed"/>
 <span>
   Stay up to date. You can unsubscribe at any time!
 </span>
 <div class="grid">

   <input type="submit" value="Subscribe" />
  </div>
</form>
